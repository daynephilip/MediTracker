version: '3.8'

services:
  medication-companion:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH}
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./medical_tracker.db:/app/medical_tracker.db
      - ./logs:/app/logs
